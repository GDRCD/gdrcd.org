name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Build
        run: pnpm build
